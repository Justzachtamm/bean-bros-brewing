[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# ---------------------------------------------------------------------------
# Security headers
#
# Before this, the only header the site sent was HSTS. Everything below is
# defence the browser applies for free once told to; none of it changes how the
# site behaves for a legitimate visitor.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    # Stop browsers from MIME-sniffing a response into something executable.
    X-Content-Type-Options = "nosniff"

    # No one may frame this site — the defence against clickjacking a customer
    # into clicking "buy" or "cancel subscription" inside an invisible iframe.
    # frame-ancestors in the CSP below is the modern equivalent; both are sent
    # because older browsers only understand this one.
    X-Frame-Options = "DENY"

    # Send the full URL only to ourselves. Cross-origin requests (including any
    # link a customer clicks out of an order page) get the bare origin, so
    # order ids and email addresses in a path never leak in a Referer header.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # This site needs none of these. Denying them means a compromised script
    # cannot silently reach for a camera, mic, or location prompt.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

    # Preload-eligible HSTS. Subdomains included so a forgotten http subdomain
    # cannot be used to set a cookie for the parent domain.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Isolates this browsing context from windows it opens, so a popup cannot
    # reach back into the page via window.opener.
    Cross-Origin-Opener-Policy = "same-origin"

    # ---- Content Security Policy ----
    #
    # ENFORCING. Verified against the live site before the switch: every
    # resource the page loads was checked against this policy (none blocked),
    # and a securitypolicyviolation listener recorded zero violations while
    # walking the storefront, all product cards and the subscribe flow.
    #
    # A THIRD-PARTY SCRIPT ADDED LATER WILL BE BLOCKED until its origin is added
    # to the right directive here. That is the policy working. Stripe.js needs
    # BOTH script-src https://js.stripe.com AND frame-src https://js.stripe.com;
    # the current redirect-to-Checkout flow needs neither.
    #
    # To debug, rename the key back to Content-Security-Policy-Report-Only,
    # redeploy, and read the violations in the browser console.
    #
    # REPORT-ONLY for now, deliberately. A CSP that is even slightly wrong
    # breaks a live storefront silently — a blocked script means a blank page
    # and lost sales, with nothing shown to the customer. Report-Only sends the
    # identical policy but only logs violations to the browser console, so the
    # policy can be verified against the real site before it is enforced.
    #
    # Sources, all verified against what the site actually loads:
    #   script-src   'self'           — one module bundle, served from here
    #   style-src    fonts.googleapis — the Google Fonts stylesheet
    #                'unsafe-inline'  — REQUIRED: the UI is built with React
    #                                   inline style props, which become style
    #                                   attributes. Removing this needs the
    #                                   styles moved into the stylesheet first.
    #   font-src     fonts.gstatic    — the font files themselves
    #   img-src      images.unsplash  — hero/section imagery still sourced there
    #   media-src    mixkit / pexels  — background video
    #   connect-src  'self'           — every API call is a same-origin
    #                                   /.netlify/functions/* path
    #   form-action  checkout.stripe  — where Stripe Checkout submits
    #   frame-ancestors 'none'        — clickjacking, as above
    #   object-src   'none'           — no Flash/applet vector
    #   base-uri     'self'           — a script cannot rewrite <base> to
    #                                   redirect every relative URL elsewhere
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com; media-src 'self' https://assets.mixkit.co https://videos.pexels.com; connect-src 'self' https://api.stripe.com; form-action 'self' https://checkout.stripe.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# Assets revalidate on every load.
#
# "immutable, max-age=31536000" is the right header for a build pipeline that
# emits a NEW filename whenever content changes. This project has no build step:
# the bundle is edited in place and keeps its name. Those two facts together are
# a trap — the header told browsers to keep the file for a year without asking,
# so an edit shipped to the origin never reached anyone who had already loaded
# the site. That is exactly what happened with the credential purge, and it is
# why the bundle had to be renamed once to break the poisoned caches.
#
# must-revalidate costs one conditional request per load; Netlify answers with a
# 304 and no body when nothing changed, so the bytes are still cached — only the
# freshness check is added. Correctness over a few milliseconds.
#
# If a real build pipeline is ever added here, switch this back to immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Never let a proxy or browser cache an API response. Several of these return
# one customer's orders, subscriptions, or profile; a shared cache serving that
# to the next visitor would be a data breach.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# ---------------------------------------------------------------------------
# Weekly database backup
#
# Sundays 08:00 UTC (Netlify schedules are always UTC). Snapshots accounts,
# products and orders into a separate Blobs store, keeping the last 12.
#
# This exists because Netlify's own database backups are kept for 3 days on
# this plan — enough to undo a bad deploy you noticed today, not enough to undo
# a bad write nobody spots until next week.
#
# Runs inside Netlify, so it needs no credentials: the database is already in
# its environment. Read /.netlify/functions/admin-backups (admin-only) to list
# or download snapshots.
# ---------------------------------------------------------------------------
[functions."weekly-backup"]
  schedule = "0 8 * * 0"
